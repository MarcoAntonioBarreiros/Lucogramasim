<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hematopoiese Interativa</title>
<style>
html,body{margin:0;min-height:100%;background:#07111f;color:#eef4ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot small{display:block;color:#9fb0c8;margin-top:8px}
</style>
</head>
<body>
<div class="boot" id="boot"><div><strong>Carregando Hematopoiese Interativa…</strong><small>Preparando a atividade.</small></div></div>
<script>
(async()=>{
  try{
    if(!('DecompressionStream' in window)) throw new Error('Este navegador precisa ser atualizado para abrir a atividade.');

    const urls=['data-1.txt','data-2.txt'];

    const chunks=await Promise.all(urls.map(async u=>{
      const r=await fetch(u,{cache:'no-store'});
      if(!r.ok) throw new Error('Falha ao carregar '+u);
      const b64=(await r.text()).trim();
      const raw=atob(b64);
      const bytes=new Uint8Array(raw.length);
      for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
      return bytes;
    }));

    const total=chunks.reduce((n,c)=>n+c.length,0);
    const bin=new Uint8Array(total);
    let offset=0;
    for(const chunk of chunks){
      bin.set(chunk,offset);
      offset+=chunk.length;
    }

    const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<div><strong>Não foi possível abrir a atividade.</strong><small>'+String(e.message||e)+'</small></div>';
  }
})();
</script>
</body>
</html>
